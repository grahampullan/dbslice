<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaData Plot Tests</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #board-root { position: relative; width: 1200px; height: 900px; margin: 16px auto; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <div id="board-root"></div>
  <script type="module">
    import { Context, Dataset } from "/build/dbslice.js";

    const metaUrl = "/test/data/metaData.json";
    const boardConfigUrl = "./board.json";

    async function main() {
      const boardJson = await fetch(boardConfigUrl).then((r) => r.json());

      const ctx = new Context();
      const dataset = new Dataset({ url: metaUrl, autoDetectProperties: true });
      await dataset.fetchData();
      ctx.addDataset(dataset);
      ctx.addFilter(dataset.createFilter()); // id becomes "filter-0"

      const board = ctx.addBoardFromJson(boardJson);
      board.id = "board-root";
      board.make();
    }

    main().catch((err) => console.error(err));
  </script>
</body>
</html>
